<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Something For Youuuuu🌼</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Shading and Fading Past Days */
        .date-btn.faded {
            opacity: 0.35;
            filter: grayscale(40%);
            transition: 0.3s ease;
        }
        .date-btn.faded:hover {
            opacity: 0.7; 
        }
        .date-btn.active-day {
            border-color: rgba(244, 114, 182, 0.5);
            box-shadow: 0 0 15px rgba(244, 114, 182, 0.2);
        }
        .date-btn.locked {
            pointer-events: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="theme-day1">
    <div class="container">
        <h1 class="main-title">A Little Something For Youuuuu🌼</h1>
        
        <div class="card active">
            <p class="question" style="margin-bottom: 20px;">Choose your chapter:</p>
            
            <div class="date-list">
                <!-- Monday, Sept 14 -->
                <a href="day1/index.html" id="btn-day1" class="date-btn faded">
                    <span class="date-name">Monday, Sept 14</span>
                    <span class="date-status" id="stat-day1">Completed ✓</span>
                </a>

                <!-- Tuesday, Sept 15 -->
                <a href="day2/index.html" id="btn-day2" class="date-btn faded">
                    <span class="date-name">Tuesday, Sept 15</span>
                    <span class="date-status" id="stat-day2">Completed ✓</span>
                </a>

                <!-- Wednesday, Sept 16 -->
                <a href="day3/index.html" id="btn-day3" class="date-btn faded">
                    <span class="date-name">Wednesday, Sept 16</span>
                    <span class="date-status" id="stat-day3">Completed ✓</span>
                </a>

                <!-- Thursday, Sept 17 -->
                <a href="day4/index.html" id="btn-day4" class="date-btn faded">
                    <span class="date-name">Thursday, Sept 17</span>
                    <span class="date-status" id="stat-day4">Completed ✓</span>
                </a>

                <!-- Friday, Sept 18 -->
                <a href="day5/index.html" id="btn-day5" class="date-btn faded">
                    <span class="date-name">Friday, Sept 18</span>
                    <span class="date-status" id="stat-day5">Completed ✓</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        const today = new Date();
        const currentDay = today.getDate(); 
        const currentMonth = today.getMonth() + 1;
        const currentHour = today.getHours();

        const forceTestUnlock = false; 

        if (currentMonth >= 9) {
            if (currentDay > 14) markCompleted('day1');
            if (currentDay > 15) markCompleted('day2');
            if (currentDay > 16) markCompleted('day3');
            if (currentDay > 17) markCompleted('day4');
            // Since today is past Sept 18, Friday is also marked completed and faded
            if (currentDay > 18) markCompleted('day5');

            if (forceTestUnlock) {
                unlockChapter('day5', 'Friday, Sept 18');
            }
        }

        function markCompleted(dayId) {
            const btn = document.getElementById('btn-' + dayId);
            const stat = document.getElementById('stat-' + dayId);
            if (btn && stat) {
                btn.classList.add('faded');
                btn.classList.remove('active-day', 'locked');
                stat.innerText = 'Completed ✓';
                stat.style.color = '#9ca3af';
            }
        }

        function unlockChapter(dayId, name) {
            const link = document.getElementById('btn-' + dayId);
            const status = document.getElementById('stat-' + dayId);
            if (link && status) {
                link.classList.remove('locked');
                link.classList.add('active-day');
                link.classList.remove('faded');
                status.innerText = 'Open 🔓';
                status.style.color = '#38bdf8';
            }
        }
    </script>
</body>
</html>
