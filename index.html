<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jio Space - Main Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(rgba(3, 7, 18, 0.85), rgba(3, 7, 18, 0.95)), 
                        url('images/pink-flowers-pink-tulips.webp') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(244, 114, 182, 0.2);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 8px;
            color: #f472b6;
        }
        p {
            color: #d1d5db;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .date-btn {
            display: block;
            background: linear-gradient(135deg, #f472b6, #db2777);
            color: white;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.3);
        }
        .date-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(219, 39, 119, 0.5);
        }
        /* Locked Styling */
        .date-btn.locked {
            background: rgba(55, 65, 81, 0.5);
            color: #9ca3af;
            cursor: not-allowed;
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .date-btn.locked:hover {
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>A Little Something For Youuuuu🌼</h1>
            <p>Your special interactive space. Select a chapter below, Your Highness! 🤍</p>
            
            <div class="nav-links" id="navLinksContainer">
                <a href="day1/index.html" class="date-btn" id="btn1">Monday, Sept 14 ✨</a>
                <a href="day2/index.html" class="date-btn" id="btn2">Tuesday, Sept 15 ✨</a>
                <a href="day3/index.html" class="date-btn" id="btn3">Wednesday, Sept 16 🌸</a>
                <a href="day4/index.html" class="date-btn locked" id="btn4">Thursday, Sept 17 🔒</a>
                <a href="day5/index.html" class="date-btn locked" id="btn5">Friday, Sept 18 🔒</a>
            </div>
        </div>
    </div>

    <script>
        window.onload = () => {
            const now = new Date();
            const currentDay = now.getDate();
            const currentMonth = now.getMonth() + 1;
            const currentHour = now.getHours();
            
            // Testing bypass switch for root hub
            const testBypass = true; 

            // If not bypassing, lock chapters based on date/hour
            if (!testBypass) {
                // Example check for Wednesday (Day 3): Locks if before Sept 16 or before 10 AM
                if (currentMonth < 9 || currentDay < 16 || (currentDay === 16 && currentHour < 10)) {
                    const btn3 = document.getElementById('btn3');
                    if (btn3) {
                        btn3.classList.add('locked');
                        btn3.innerText = "Wednesday, Sept 16 (10 AM) 🔒";
                    }
                }
            }

            // SECURITY: Block all clicks on elements with the 'locked' class
            document.querySelectorAll('.date-btn.locked').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault(); // Completely stops the link from opening
                    alert("Patience, Your Highness! This chapter is still locked. ⏳🤍");
                });
            });
        };
    </script>
</body>
</html>
