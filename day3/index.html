<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wednesday - Jio Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="theme-day3">
    <div class="container">
        <a href="../index.html" class="back-btn" style="float: none; display: inline-block; margin-bottom: 15px;">← Back to Chapters</a>
        <h1 class="main-title">Wednesday, Sept 16 🎵</h1>
        
        <div class="card active">
            <div class="top-meta-row">
                <span class="disclaimer-tag">⚠️ Mid-week check-in</span>
                <span class="insta-tag">Headphones on! 🎧</span>
            </div>
            <p class="question">Hump day soundtrack recommendation:</p>
            <div class="note-card" style="text-align: center; margin-bottom: 20px;">
                <p style="font-weight: 600; color: #fff; font-size: 16px;">"Coffee" — Beabadoobee</p>
                <p class="note-text" style="text-align: center; font-size: 13px; color: #aaa;">"And I walk you home / Our-our sides touch and I feel happy..."</p>
            </div>
            <p class="question" style="font-size: 14px;">Rate this track selection:</p>
            <div class="button-group">
                <button onclick="rateSong('10')">10/10 Vibe ✨</button>
                <button onclick="rateSong('perfect')" class="alt-button">Absolute Peak 🤍</button>
            </div>
            <p id="songMsg" class="error hidden" style="color: #f9d423; margin-top: 20px; font-size: 14px;"></p>
        </div>
    </div>
    <script>
        function rateSong(val) {
            const m = document.getElementById("songMsg");
            m.innerText = "Glad you approve. Saving it for our next coffee run. ☕";
            m.classList.remove("hidden");
        }
    </script>
</body>
</html>
